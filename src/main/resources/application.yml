server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: los-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false
        jdbc:
          lob:
            non_contextual_creation: true
  jackson:
    serialization:
      indent_output: true
      write_dates_as_timestamps: false
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 86400000  # 24 hours
    refresh-token-expiration-ms: 604800000 # 7 days
    issuer: LOS-Platform
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,https://system-rimge9vct-pranav-3745.vercel.app}
  security:
    rate-limit:
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:10}
      api-per-minute: ${RATE_LIMIT_API_PER_MIN:120}
  # Render / Cloud Free Tier Keep-Alive Heartbeat
  render:
    keep-alive:
      enabled: ${RENDER_KEEP_ALIVE_ENABLED:true}
      url: ${RENDER_EXTERNAL_URL:${APP_KEEP_ALIVE_URL:}}
      interval-ms: ${RENDER_KEEP_ALIVE_INTERVAL_MS:600000} # 10 minutes (prevents 15m idle shutdown)

  # Mail — disabled until SMTP credentials are configured via env vars
  # To activate: set MAIL_ENABLED=true and provide SMTP creds
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@losplatform.com}

# Master Database (Registry & Global Routing)
master:
  datasource:
    url: ${MASTER_DB_URL:jdbc:postgresql://localhost:5432/los_master_db}
    username: ${MASTER_DB_USERNAME:postgres}
    password: ${MASTER_DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: MasterHikariPool

# Default / Fallback Bank Datasource template (used for dynamic bank pools)
bank:
  datasource:
    default-host: ${BANK_DB_HOST:${TENANT_DB_HOST:localhost}}
    default-port: ${BANK_DB_PORT:${TENANT_DB_PORT:5432}}
    username: ${BANK_DB_USERNAME:${TENANT_DB_USERNAME:postgres}}
    password: ${BANK_DB_PASSWORD:${TENANT_DB_PASSWORD:root}}
    driver-class-name: org.postgresql.Driver

tenant:
  datasource:
    default-host: ${TENANT_DB_HOST:${BANK_DB_HOST:localhost}}
    default-port: ${TENANT_DB_PORT:${BANK_DB_PORT:5432}}
    username: ${TENANT_DB_USERNAME:${BANK_DB_USERNAME:postgres}}
    password: ${TENANT_DB_PASSWORD:${BANK_DB_PASSWORD:root}}
    driver-class-name: org.postgresql.Driver

organization:
  datasource:
    default-host: ${ORGANIZATION_DB_HOST:${TENANT_DB_HOST:${BANK_DB_HOST:localhost}}}
    default-port: ${ORGANIZATION_DB_PORT:${TENANT_DB_PORT:${BANK_DB_PORT:5432}}}
    username: ${ORGANIZATION_DB_USERNAME:${TENANT_DB_USERNAME:${BANK_DB_USERNAME:postgres}}}
    password: ${ORGANIZATION_DB_PASSWORD:${TENANT_DB_PASSWORD:${BANK_DB_PASSWORD:root}}}
    driver-class-name: org.postgresql.Driver

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false
